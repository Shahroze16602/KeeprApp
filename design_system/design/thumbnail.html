<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-display)}
  .main{flex:1;background:var(--keep-grad);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  .name{font-weight:900;font-size:180px;letter-spacing:-.06em;color:#14110F;display:flex;align-items:flex-end;line-height:1}
  .dot{width:34px;height:34px;border-radius:99px;background:#0F0E0D;margin-left:14px;margin-bottom:34px}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip span{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main">
    <svg width="230" height="230" viewBox="0 0 100 100" fill="none">
      <g transform="rotate(-13 50 54)">
        <rect x="20" y="26" width="52" height="62" rx="15" fill="#00B8F0" stroke="#000" stroke-width="6"/>
        <rect x="30" y="52" width="24" height="7" rx="3.5" fill="#fff" opacity=".85"/>
        <rect x="30" y="64" width="15" height="7" rx="3.5" fill="#fff" opacity=".55"/>
      </g>
      <g transform="rotate(9 52 50)">
        <rect x="30" y="14" width="54" height="64" rx="16" fill="#FFF3E6" stroke="#000" stroke-width="6"/>
        <path d="M43 47 L53 57 L72 34" stroke="#FF6B2C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </svg>
    <div class="name">Keepr<span class="dot"></span></div>
  </div>
  <div class="strip">
    <span style="background:#FFC63C"></span>
    <span style="background:#2ED77E"></span>
    <span style="background:#00B8F0"></span>
    <span style="background:#0E6FCC"></span>
  </div>
</div>
</body>
</html>
