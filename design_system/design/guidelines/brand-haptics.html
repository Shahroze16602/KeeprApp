<!-- @dsCard group="Brand" viewport="700x230" name="Haptic map" subtitle="Feedback fires at threshold, commit, milestone." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:18px 22px;color:var(--text-body)}
  .row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:2px solid var(--border-soft)}
  .row:last-child{border:0}
  .k{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-strong);width:150px;flex:0 0 auto}
  .v{font-weight:600;font-size:13px;color:var(--text-muted)}
  .pip{width:auto;padding:3px 9px;border-radius:var(--r-pill);border:2px solid var(--border-hard);font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="row"><span class="k">Threshold</span><span class="pip" style="background:var(--surface-card-2);color:var(--text-strong)">Light tick</span><span class="v">card crosses the swipe line</span></div>
  <div class="row"><span class="k">Commit</span><span class="pip" style="background:var(--keep-grad);color:var(--keep-ink)">Medium thud</span><span class="v">keep / delete committed</span></div>
  <div class="row"><span class="k">Combo</span><span class="pip" style="background:var(--surface-card-2);color:var(--text-strong)">Light ×2</span><span class="v">combo increments</span></div>
  <div class="row"><span class="k">Milestone</span><span class="pip" style="background:var(--reward-grad);color:#241800">Heavy + buzz</span><span class="v">badge unlocked</span></div>
  <div class="row"><span class="k">Reclaim</span><span class="pip" style="background:var(--reward-grad);color:#241800">Rising ramp</span><span class="v">GB counter slams home</span></div>
</body>
</html>
