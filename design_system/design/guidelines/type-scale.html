<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-display);padding:16px 22px;color:var(--text-strong)}
  .row{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--border-soft);padding:7px 0}
  .tag{font-family:var(--font-ui);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);width:88px;flex:0 0 auto}
  .s{font-weight:900;letter-spacing:-.03em;line-height:1;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
  <div class="row"><span class="tag">Colossal 140</span><span class="s" style="font-size:52px">10K</span></div>
  <div class="row"><span class="tag">Mega 96</span><span class="s" style="font-size:44px">2.4 GB</span></div>
  <div class="row"><span class="tag">Display 52</span><span class="s" style="font-size:34px">Cleared</span></div>
  <div class="row"><span class="tag">H1 · H2 · H3</span><span class="s" style="font-size:22px">Smart piles ready</span></div>
  <div class="row"><span class="tag">Body 16</span><span class="s" style="font-size:16px;font-weight:500">Swipe right to keep.</span></div>
  <div class="row" style="border:0"><span class="tag">Label 12</span><span class="s" style="font-size:12px;font-family:var(--font-ui);font-weight:800;letter-spacing:.12em">THIS MONTH</span></div>
</body>
</html>
