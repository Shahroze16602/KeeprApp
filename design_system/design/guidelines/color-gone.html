<!-- @dsCard group="Colors" viewport="700x150" name="Gone — cool accent" subtitle="Swipe left. Bold, joyful, never alarming." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:18px;display:flex;gap:14px}
  .sw{flex:1;border:var(--bw) solid var(--border-hard);border-radius:var(--r-md);box-shadow:var(--shadow-hard-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;min-height:104px}
  .name{font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#04121A}
  .hex{font-weight:900;font-size:13px;color:#04121A;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <div class="sw" style="background:var(--gone-grad)"><span class="name">Gone Gradient</span></div>
  <div class="sw" style="background:var(--gone-500)"><span class="name">Gone 500</span><span class="hex">#00B8F0</span></div>
  <div class="sw" style="background:var(--gone-300)"><span class="name">Gone 300</span><span class="hex">#6FD6FF</span></div>
  <div class="sw" style="background:var(--gone-wash);border-color:var(--gone-500)"><span class="name" style="color:var(--text-strong)">Wash</span></div>
</body>
</html>
