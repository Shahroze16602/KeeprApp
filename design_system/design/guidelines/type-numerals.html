<!-- @dsCard group="Type" viewport="700x180" name="Numerals — the loud counts" subtitle="Tabular, black weight, tight tracking." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);padding:16px 22px;color:var(--text-strong);display:flex;align-items:center;gap:28px}
  .mega{font-family:var(--font-num);font-weight:900;font-size:96px;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums;background:var(--reward-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .col{display:flex;flex-direction:column}
  .n{font-family:var(--font-num);font-weight:900;font-size:34px;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
  .lbl{font-family:var(--font-ui);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
</style>
</head>
<body>
  <div><div class="mega">2.4</div><div class="lbl" style="text-align:center">GB reclaimed</div></div>
  <div class="col"><span class="n">10,482</span><span class="lbl">photos</span></div>
  <div class="col"><span class="n" style="color:var(--keep)">×7</span><span class="lbl">combo</span></div>
</body>
</html>
