<!-- @dsCard group="Colors" viewport="700x150" name="Reward & Win" subtitle="Gold for reclaimed/XP, green for streaks." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:18px;display:flex;gap:14px}
  .sw{flex:1;border:var(--bw) solid var(--border-hard);border-radius:var(--r-md);box-shadow:var(--shadow-hard-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;min-height:104px}
  .name{font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#241800}
  .hex{font-weight:900;font-size:13px;color:#241800;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <div class="sw" style="background:var(--reward-grad)"><span class="name">Reward Gradient</span></div>
  <div class="sw" style="background:var(--reward-500)"><span class="name">Reward 500</span><span class="hex">#FFC63C</span></div>
  <div class="sw" style="background:var(--win-500)"><span class="name" style="color:#04160C">Win 500</span><span class="hex" style="color:#04160C">#2ED77E</span></div>
  <div class="sw" style="background:var(--win-700)"><span class="name" style="color:#fff">Win 700</span><span class="hex" style="color:#fff">#16A85C</span></div>
</body>
</html>
