<!-- @dsCard group="Shape" viewport="700x160" name="Chunky borders" subtitle="Ink outlines do the lifting." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:20px 22px;display:flex;align-items:center;gap:20px}
  .u{display:flex;flex-direction:column;align-items:center;gap:10px}
  .b{width:96px;height:66px;background:var(--surface-card-2);border-radius:var(--r-md);border-color:var(--border-hard);border-style:solid}
  .t{font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="u"><div class="b" style="border-width:2px"></div><span class="t">thin 2</span></div>
  <div class="u"><div class="b" style="border-width:3px"></div><span class="t">base 3</span></div>
  <div class="u"><div class="b" style="border-width:4px"></div><span class="t">thick 4</span></div>
  <div class="u"><div class="b" style="border-width:5px"></div><span class="t">slab 5</span></div>
</body>
</html>
