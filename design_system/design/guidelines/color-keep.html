<!-- @dsCard group="Colors" viewport="700x150" name="Keep — warm accent" subtitle="Swipe right. Gradient + solid + wash." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:18px;display:flex;gap:14px;align-items:stretch}
  .sw{flex:1;border:var(--bw) solid var(--border-hard);border-radius:var(--r-md);box-shadow:var(--shadow-hard-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;min-height:104px}
  .name{font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#0F0E0D}
  .hex{font-weight:900;font-size:13px;color:#0F0E0D;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <div class="sw" style="background:var(--keep-grad)"><span class="name">Keep Gradient</span></div>
  <div class="sw" style="background:var(--keep-500)"><span class="name">Keep 500</span><span class="hex">#FF6B2C</span></div>
  <div class="sw" style="background:var(--keep-300)"><span class="name">Keep 300</span><span class="hex">#FFB877</span></div>
  <div class="sw" style="background:var(--keep-wash);border-color:var(--keep-500)"><span class="name" style="color:var(--text-strong)">Wash</span></div>
</body>
</html>
