<!-- @dsCard group="Motion" viewport="700x180" name="Easing — overshoot is house style" subtitle="Springy, bouncy, snap-and-settle." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:22px 26px;display:flex;align-items:center;gap:36px}
  .u{display:flex;flex-direction:column;align-items:center;gap:12px}
  .track{width:110px;height:14px;background:var(--surface-inset);border:2px solid var(--border-hard);border-radius:var(--r-pill);position:relative;overflow:visible}
  .dot{position:absolute;top:50%;left:4px;width:22px;height:22px;margin-top:-11px;border-radius:var(--r-pill);background:var(--keep-grad);border:2px solid var(--border-hard)}
  .t{font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
  @keyframes run{0%{left:4px}100%{left:84px}}
  .spring{animation:run 1.4s var(--ease-spring) infinite alternate}
  .boing{animation:run 1.4s var(--ease-boing) infinite alternate}
  .snap{animation:run 1.4s var(--ease-snap-back) infinite alternate}
</style>
</head>
<body>
  <div class="u"><div class="track"><div class="dot spring"></div></div><span class="t">spring 1.56</span></div>
  <div class="u"><div class="track"><div class="dot boing"></div></div><span class="t">boing 1.9</span></div>
  <div class="u"><div class="track"><div class="dot snap"></div></div><span class="t">snap-back 1.3</span></div>
</body>
</html>
