<!-- @dsCard group="Shape" viewport="700x160" name="Corner radii" subtitle="Large everywhere. Pills for controls." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:20px 22px;display:flex;align-items:center;gap:14px}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .b{width:74px;height:74px;background:var(--surface-card);border:var(--bw) solid var(--border-hard);box-shadow:var(--shadow-hard-sm)}
  .t{font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="u"><div class="b" style="border-radius:var(--r-sm)"></div><span class="t">sm 12</span></div>
  <div class="u"><div class="b" style="border-radius:var(--r-md)"></div><span class="t">md 18</span></div>
  <div class="u"><div class="b" style="border-radius:var(--r-lg)"></div><span class="t">lg 26</span></div>
  <div class="u"><div class="b" style="border-radius:var(--r-xl)"></div><span class="t">xl 34</span></div>
  <div class="u"><div class="b" style="border-radius:var(--r-2xl)"></div><span class="t">2xl 44</span></div>
  <div class="u"><div class="b" style="border-radius:var(--r-pill)"></div><span class="t">pill</span></div>
  <div class="u"><div class="b" style="border-radius:var(--r-sticker)"></div><span class="t">sticker</span></div>
</body>
</html>
