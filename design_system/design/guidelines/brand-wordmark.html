<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="Authored Keepr wordmark and compact K mark." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-display);padding:28px 30px;display:flex;align-items:center;gap:26px}
  .mark{display:inline-flex;align-items:center;gap:2px;font-weight:900;font-size:56px;letter-spacing:-.05em;color:var(--text-strong)}
  .dot{width:16px;height:16px;border-radius:var(--r-pill);background:var(--keep-grad);border:3px solid var(--border-hard);margin-left:6px;align-self:flex-end;margin-bottom:12px}
  .chip{font-family:var(--font-display);font-weight:900;font-size:34px;letter-spacing:-.05em;color:var(--keep-ink);background:var(--keep-grad);border:var(--bw-thick) solid var(--border-hard);border-radius:var(--r-md);padding:6px 14px;box-shadow:var(--shadow-hard)}
</style>
</head>
<body>
  <span class="mark">Keepr<span class="dot"></span></span>
  <span class="chip">K</span>
</body>
</html>
