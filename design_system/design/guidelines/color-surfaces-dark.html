<!-- @dsCard group="Colors" viewport="700x160" name="Semantic surfaces — Dark" subtitle="The hero surface. Chrome floats over photos." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:18px;display:flex;gap:12px}
  .sw{flex:1;border:var(--bw) solid var(--border-hard);border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;min-height:110px;box-shadow:var(--shadow-hard-sm)}
  .name{font-weight:800;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-strong)}
  .var{font-weight:700;font-size:10px;color:var(--text-muted);margin-top:2px}
</style>
</head>
<body>
  <div class="sw" style="background:var(--bg-app)"><span class="name">App</span><span class="var">--bg-app</span></div>
  <div class="sw" style="background:var(--surface-card)"><span class="name">Card</span><span class="var">--surface-card</span></div>
  <div class="sw" style="background:var(--surface-card-2)"><span class="name">Card 2</span><span class="var">--surface-card-2</span></div>
  <div class="sw" style="background:var(--surface-inset)"><span class="name">Inset</span><span class="var">--surface-inset</span></div>
</body>
</html>
