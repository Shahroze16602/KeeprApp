<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base, leans large." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:20px 22px;display:flex;align-items:flex-end;gap:14px}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--keep-grad);border:2px solid var(--border-hard);border-radius:6px;width:26px}
  .t{font-weight:800;font-size:10px;letter-spacing:.06em;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="u"><div class="bar" style="height:8px"></div><span class="t">2·8</span></div>
  <div class="u"><div class="bar" style="height:16px"></div><span class="t">4·16</span></div>
  <div class="u"><div class="bar" style="height:24px"></div><span class="t">6·24</span></div>
  <div class="u"><div class="bar" style="height:40px"></div><span class="t">8·40</span></div>
  <div class="u"><div class="bar" style="height:48px"></div><span class="t">9·48</span></div>
  <div class="u"><div class="bar" style="height:64px"></div><span class="t">10·64</span></div>
  <div class="u"><div class="bar" style="height:80px"></div><span class="t">12·80</span></div>
</body>
</html>
