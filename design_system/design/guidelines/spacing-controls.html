<!-- @dsCard group="Spacing" viewport="700x150" name="Control sizing" subtitle="Chunky hit targets, 48px floor." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:20px 22px;display:flex;align-items:center;gap:18px}
  .box{background:var(--surface-card-2);border:var(--bw) solid var(--border-hard);border-radius:var(--r-pill);box-shadow:var(--shadow-hard-sm);display:flex;align-items:center;justify-content:center;color:var(--text-strong);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .cap{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-top:8px;text-align:center}
  .u{display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
  <div class="u"><div class="box" style="height:64px;padding:0 30px">LG 64</div><span class="cap">Primary</span></div>
  <div class="u"><div class="box" style="height:56px;padding:0 26px">MD 56</div><span class="cap">Default</span></div>
  <div class="u"><div class="box" style="height:48px;padding:0 20px">SM 48</div><span class="cap">Min target</span></div>
  <div class="u"><div class="box" style="height:56px;width:56px;border-radius:var(--r-pill)">56</div><span class="cap">Icon</span></div>
</body>
</html>
