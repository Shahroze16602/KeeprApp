<!-- @dsCard group="Shape" viewport="700x180" name="Press physics" subtitle="Buttons depress into their shadow." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:24px;display:flex;align-items:center;justify-content:center;gap:40px}
  .u{display:flex;flex-direction:column;align-items:center;gap:14px}
  .btn{height:56px;padding:0 30px;display:flex;align-items:center;font-weight:800;font-size:16px;letter-spacing:-.01em;text-transform:uppercase;color:var(--keep-ink);background:var(--keep-grad);border:var(--bw) solid var(--border-hard);border-radius:var(--r-pill)}
  .rest{box-shadow:var(--shadow-hard)}
  .down{box-shadow:var(--shadow-pressed);transform:translate(3px,4px)}
  .t{font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="u"><div class="btn rest">Keep</div><span class="t">Rest</span></div>
  <div class="u"><div class="btn down">Keep</div><span class="t">Pressed · translate 3,4</span></div>
</body>
</html>
