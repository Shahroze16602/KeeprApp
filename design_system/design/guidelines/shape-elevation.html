<!-- @dsCard group="Shape" viewport="700x170" name="Hard elevation" subtitle="Solid offset shadows, no feather." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:22px 26px;display:flex;align-items:center;gap:26px}
  .u{display:flex;flex-direction:column;align-items:center;gap:12px}
  .b{width:88px;height:60px;background:var(--surface-card-2);border:var(--bw) solid var(--border-hard);border-radius:var(--r-md)}
  .t{font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="u"><div class="b" style="box-shadow:var(--shadow-hard-sm)"></div><span class="t">sm 3·3</span></div>
  <div class="u"><div class="b" style="box-shadow:var(--shadow-hard)"></div><span class="t">base 5·6</span></div>
  <div class="u"><div class="b" style="box-shadow:var(--shadow-hard-lg)"></div><span class="t">lg 7·9</span></div>
  <div class="u"><div class="b" style="box-shadow:var(--shadow-hard-xl)"></div><span class="t">xl 10·12</span></div>
  <div class="u"><div class="b" style="box-shadow:var(--shadow-pressed);transform:translate(4px,5px)"></div><span class="t">pressed</span></div>
</body>
</html>
