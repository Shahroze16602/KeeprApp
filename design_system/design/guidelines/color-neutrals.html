<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — deep & rich" subtitle="Faintly cool charcoals so photos pop." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-ui);padding:18px;display:flex;gap:8px}
  .sw{flex:1;border:2px solid var(--border-soft);border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:104px}
  .name{font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="sw" style="background:var(--n-950)"><span class="name" style="color:#fff">950</span></div>
  <div class="sw" style="background:var(--n-900)"><span class="name" style="color:#fff">900</span></div>
  <div class="sw" style="background:var(--n-800)"><span class="name" style="color:#fff">800</span></div>
  <div class="sw" style="background:var(--n-700)"><span class="name" style="color:#fff">700</span></div>
  <div class="sw" style="background:var(--n-500)"><span class="name" style="color:#fff">500</span></div>
  <div class="sw" style="background:var(--n-300)"><span class="name" style="color:#111">300</span></div>
  <div class="sw" style="background:var(--n-100)"><span class="name" style="color:#111">100</span></div>
  <div class="sw" style="background:var(--n-0)"><span class="name" style="color:#111">0</span></div>
</body>
</html>
