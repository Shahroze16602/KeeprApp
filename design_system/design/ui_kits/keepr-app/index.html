  html,body{margin:0;min-height:100%;background:#c9beaa;font-family:var(--font-ui)}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:clamp(8px,2.5vw,22px);box-sizing:border-box;overflow:auto}
  .phone{position:relative;width:min(400px,calc(100vw - 30px));height:min(848px,calc(100dvh - 30px));min-height:560px;background:var(--bg-app);border:7px solid #000;border-radius:clamp(34px,10vw,52px);overflow:hidden;box-shadow:clamp(7px,3vw,16px) clamp(9px,4vw,20px) 0 rgba(0,0,0,.32);display:flex;flex:0 0 auto;flex-direction:column}
  /* demo panel */
  #demo{position:fixed;top:0;right:0;height:100%;width:266px;box-sizing:border-box;background:#151310;border-left:3px solid #000;box-shadow:-10px 0 40px rgba(0,0,0,.4);display:flex;flex-direction:column;transform:translateX(266px);transition:transform .34s cubic-bezier(.2,1.1,.3,1);z-index:200;font-family:var(--font-ui,sans-serif);color:#EDE7DC}
  #demo.open{transform:none}
  #demoToggle{position:fixed;top:16px;right:16px;z-index:201;min-height:48px;padding:0 15px;display:flex;align-items:center;gap:8px;background:#FF6B2C;color:#1a0f06;border:3px solid #000;border-radius:99px;box-shadow:3px 4px 0 rgba(0,0,0,.4);cursor:pointer;font-weight:800;font-size:13px;letter-spacing:.02em}
  #demo h4{margin:0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8b8377;font-weight:800}
  .demo-scroll{flex:1;overflow-y:auto;padding:14px 14px 24px}
  .demo-scroll::-webkit-scrollbar{width:0}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 4px}
  .dbtn{text-align:left;padding:8px 9px;background:#221e19;border:1.5px solid #38322a;border-radius:9px;color:#EDE7DC;font-size:11.5px;font-weight:700;cursor:pointer;line-height:1.15;transition:all .12s}
  .dbtn:hover{border-color:#FF6B2C;background:#2c2620}
  .dbtn.on{background:#FF6B2C;color:#1a0f06;border-color:#000}
  .dbtn small{display:block;font-size:9px;font-weight:600;opacity:.6;margin-top:1px}
  .drow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:#221e19;border:1.5px solid #38322a;border-radius:9px;margin-bottom:6px;font-size:12px;font-weight:700}
  .dtog{width:52px;height:32px;padding:0;border-radius:99px;border:2px solid #000;background:#4a423a;position:relative;cursor:pointer;flex:0 0 auto}
  .dtog.on{background:#2ED77E}
  .dtog i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:99px;background:#fff;transition:left .18s}
  .dtog.on i{left:22px}
  .dsep{height:1px;background:#2a251f;margin:14px 0 10px}
  #app{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
  .screen{flex:1;position:relative;min-height:0;overflow:hidden}
  .statusbar{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-family:var(--font-num);font-weight:800;font-size:14px;color:var(--text-strong);flex:0 0 auto;z-index:50;position:relative}
  .statusbar .sb-r{display:flex;gap:7px;align-items:center;font-size:15px}
  .themebtn{background:none;border:none;color:var(--text-muted);font-size:17px;cursor:pointer;display:flex;align-items:center}
  a{color:var(--keep-600)}a:hover{color:var(--keep-500)}
  .k-hide-scroll::-webkit-scrollbar{display:none}.k-hide-scroll{scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  @keyframes k-confetti{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(900px) rotate(560deg)}}
  @keyframes k-sheet{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
  @media (max-width:700px){#demo{width:min(286px,88vw);transform:translateX(100%)}#demoToggle{top:10px;right:10px}.statusbar{padding:0 18px}}
  @media (max-height:620px){.phone{min-height:0;height:calc(100dvh - 16px)}body{align-items:flex-start}}
  .phone[dir="rtl"] .ph-caret-left,.phone[dir="rtl"] .ph-arrow-right{display:inline-block;transform:scaleX(-1)}
</style>

<script>
  // ---- shared demo data ----
  const _mk = (id, seed, date, mb) => ({ id, seed, date, mb, size: mb.toFixed(1) + " MB", src: `https://picsum.photos/seed/${seed}/600/800` });
  window.KEEPR_PHOTOS = [
    _mk(1,"kpr-a","Mar 3",4.2),_mk(2,"kpr-b","Mar 5",3.1),_mk(3,"kpr-c","Mar 8",8.6),_mk(4,"kpr-d","Mar 11",2.4),
    _mk(5,"kpr-e","Mar 14",5.9),_mk(6,"kpr-f","Mar 17",1.8),_mk(7,"kpr-g","Mar 21",7.2),_mk(8,"kpr-h","Mar 26",3.7),
    _mk(9,"kpr-i","Mar 28",6.1),_mk(10,"kpr-j","Mar 30",2.9),_mk(11,"kpr-k","Mar 31",4.6),_mk(12,"kpr-l","Mar 2",3.3),
  ];
  window.KEEPR_DECK = window.KEEPR_PHOTOS.slice(0, 9).map((p, i) => i === 4 ? { ...p, broken: true } : { ...p });
  window.KEEPR_MONTHS = [
    { id:"mar", month:"March", year:"2024", total:412, done:0, state:"active" },
    { id:"feb", month:"February", year:"2024", total:380, done:380, state:"done", reclaim:"1.8 GB" },
    { id:"jan", month:"January", year:"2024", total:512, done:512, state:"done", reclaim:"3.1 GB" },
    { id:"dec", month:"December", year:"2023", total:640, done:0, state:"active" },
    { id:"nov", month:"November", year:"2023", total:521, done:0, state:"active" },
  ];
</script>

<script type="text/babel" src="logo.jsx?v=20260802-production"></script>

<script type="text/babel" data-presets="react">
  const LS = "keepr_state_v1";
  const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };

  function App() {
    const persisted = React.useRef(load()).current;
    const [state, setState] = React.useState({ analytics: !!persisted.analytics });
    const [stack, setStack] = React.useState([{ screen: "splash", params: {} }]);
    const cur = stack[stack.length - 1];

    const set = (patch) => setState((s) => { const n = { ...s, ...patch }; localStorage.setItem(LS, JSON.stringify(n)); return n; });
    const go = (screen, params = {}) => {
      setStack((st) => (screen === "main" ? [{ screen: "main", params }] : [...st, { screen, params }]));
    };
    const back = () => setStack((st) => (st.length > 1 ? st.slice(0, -1) : st));

    // splash decides first-run destination
    const registry = {
      splash: (p) => <window.Splash go={go} next="language" />,
      language: () => <window.Language go={go} back={back} />,
      "language-s": () => <window.Language go={go} back={back} standalone />,
      onboarding: () => <window.Onboarding go={go} back={back} />,
      access: () => <window.MediaAccess go={go} back={back} />,
      selected: () => <window.Selected go={go} back={back} />,
      main: () => <window.Main go={go} />,
      session: (p) => <window.Session go={go} params={p} />,
      review: (p) => <window.Review go={go} params={p} />,
      confirm: (p) => <window.Confirm go={go} params={p} />,
      progress: (p) => <window.Progress go={go} params={p} />,
      complete: (p) => <window.Complete go={go} params={p} />,
      "permission-denied": () => <window.PermissionDenied go={go} />,
      empty: (p) => <window.EmptyLibrary go={go} params={p} />,
      resume: () => <window.ResumeRecovery go={go} />,
      "partial-delete": (p) => <window.DeletePartial go={go} params={p} />,
      settings: () => <window.Settings go={go} state={state} set={set} />,
      privacy: () => <window.Privacy go={go} back={back} />,
      analytics: () => <window.Analytics go={go} back={back} state={state} set={set} />,
      feedback: () => <window.Feedback go={go} back={back} />,
      rate: () => <window.Rate go={go} back={back} />,
      reset: () => <window.Reset go={go} back={back} set={set} />,
    };
    const render = registry[cur.screen] || registry.main;

    React.useEffect(() => {
      window.__keeprDemo = { go, set, back, get: () => ({ ...state, screen: cur.screen }) };
      window.dispatchEvent(new CustomEvent("keepr-demo-sync"));
    });

    React.useEffect(() => {
      const phone = document.getElementById("phone");
      if (localStorage.getItem("keepr_theme") === "light") phone.setAttribute("data-theme", "light");
      phone.setAttribute("data-motion", localStorage.getItem("keepr_motion") || "full");
      const locale = localStorage.getItem("keepr_lang") || "en";
      phone.lang = locale;
      phone.dir = locale === "ar" ? "rtl" : "ltr";
    }, []);

    return <div className="screen" key={cur.screen + stack.length}>{render(cur.params)}</div>;
  }

  ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

<script>
  // ---- Prototype control panel (plain JS, outside React) ----
  (function () {
    const demoMonth = { month: "March", year: "2024", total: 412, done: 0 };
    const R = { kept: 6, deleted: 4, gb: 0.62, month: demoMonth };
    const groups = [
      ["First run", [
        ["splash", "Splash", "01"], ["language", "Language", "02"], ["onboarding", "Onboarding", "03"], ["access", "Media Access", "04"],
      ]],
      ["Core loop", [
        ["main", "Month Picker", "05"], ["selected", "Selected Photos", "06"], ["session:m", "Cleanup Swipe", "07"], ["session:broke", "Load Recovery", "08"],
        ["review:m", "Review", "09"], ["confirm:r", "Delete Confirm", "10"], ["progress:r", "Deleting", "11"], ["complete:r", "Completion", "12"],
      ]],
      ["System", [
        ["settings", "Settings", "14"], ["privacy", "Privacy", "13"], ["analytics", "Analytics", "15"],
        ["feedback", "Feedback", "16"], ["rate", "Rate Us", "17"], ["reset", "Reset", "18"],
      ]],
      ["Recovery & empty", [
        ["permission-denied", "Permission denied", "19"], ["empty", "Empty library", "20"],
        ["resume", "Resume session", "21"], ["partial-delete:r", "Partial deletion", "22"],
      ]],
    ];
    const D = () => window.__keeprDemo;
    const dispatch = (key) => {
      const d = D(); if (!d) return;
      const [scr, arg] = key.split(":");
      if (scr === "session") { window.KEEPR_DECK = window.KEEPR_PHOTOS.slice(0, 9).map((p, i) => ({ ...p, broken: arg === "broke" && i === 0 })); d.go("session", { month: demoMonth }); }
      else if (scr === "review") d.go("review", { month: demoMonth });
      else if (scr === "confirm") d.go("confirm", { result: R });
      else if (scr === "progress") d.go("progress", { result: R });
      else if (scr === "complete") d.go("complete", { result: R });
      else if (scr === "partial-delete") d.go("partial-delete", { result: { ...R, deleted: 7, unresolved: 3 } });
      else d.go(scr, {});
    };

    const body = document.getElementById("demoBody");
    let curScreen = "splash";
    function build() {
      const st = D() ? D().get() : { analytics: false };
      body.innerHTML = "";
      groups.forEach(([name, items]) => {
        const h = document.createElement("h4"); h.textContent = name; h.style.margin = "6px 2px 2px"; body.appendChild(h);
        const g = document.createElement("div"); g.className = "dgrid";
        items.forEach(([key, label, num]) => {
          const b = document.createElement("button"); b.className = "dbtn" + (key.split(":")[0] === curScreen ? " on" : "");
          b.innerHTML = label + "<small>SCR-" + num + "</small>";
          b.onclick = () => dispatch(key);
          g.appendChild(b);
        });
        body.appendChild(g);
      });
      const sep = document.createElement("div"); sep.className = "dsep"; body.appendChild(sep);
      const sh = document.createElement("h4"); sh.textContent = "State"; sh.style.margin = "0 2px 8px"; body.appendChild(sh);
      addToggle(body, "Analytics consent", !!st.analytics, (v) => D() && D().set({ analytics: v }));
      const reset = document.createElement("button"); reset.className = "dbtn"; reset.style.width = "100%"; reset.style.textAlign = "center"; reset.style.marginTop = "8px";
      reset.innerHTML = '<i class="ph-fill ph-arrow-counter-clockwise"></i> Restart first-run';
      reset.onclick = () => { localStorage.removeItem("keepr_state_v1"); D() && D().set({ analytics: false }); D() && D().go("splash"); };
      body.appendChild(reset);
    }
    function addToggle(parent, label, on, cb) {
      const row = document.createElement("div"); row.className = "drow";
      const span = document.createElement("span"); span.textContent = label; row.appendChild(span);
      const t = document.createElement("button"); t.type = "button"; t.className = "dtog" + (on ? " on" : ""); t.setAttribute("role", "switch"); t.setAttribute("aria-label", label); t.setAttribute("aria-checked", String(on)); t.innerHTML = "<i></i>";
      t.onclick = () => { const nv = !t.classList.contains("on"); t.classList.toggle("on", nv); cb(nv); };
      row.appendChild(t); parent.appendChild(row);
    }
    window.addEventListener("keepr-demo-sync", () => { const d = D(); if (d) curScreen = d.get().screen; build(); });
    document.getElementById("demoToggle").addEventListener("click", (event) => {
      const open = document.getElementById("demo").classList.toggle("open");
      event.currentTarget.setAttribute("aria-expanded", String(open));
    });
    setTimeout(build, 400);
  })();
</script>
</body>
